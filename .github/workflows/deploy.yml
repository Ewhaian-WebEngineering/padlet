name: CI/CD Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BACKEND_ENV_PATH: "/home/ubuntu/app/back/.env"
      FRONTEND_ENV_PATH: "/home/ubuntu/app/front/.env"

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            APP_DIR="/home/ubuntu/app"

            # SSH host key 자동 등록
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            # 앱 디렉토리 초기화 후 SSH clone
            if [ -d "$APP_DIR" ]; then
              rm -rf "$APP_DIR"
            fi
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            git clone git@github.com:Ewhaian-WebEngineering/padlet.git "$APP_DIR"

            # 1️⃣ back 설치 및 PM2 재시작
            cd "$APP_DIR/back"
            npm install
            if [ -f ecosystem.config.cjs ]; then
              pm2 startOrRestart ecosystem.config.cjs --env production
            else
              echo "ecosystem.config.cjs 파일이 없습니다. PM2 재시작 건너뜀."
            fi

            # 2️⃣ .env 복사 (백엔드)
            if [ -f "${BACKEND_ENV_PATH}" ]; then
              cp "${BACKEND_ENV_PATH}" "$APP_DIR/back/.env"
            else
              echo "백엔드 .env 파일이 존재하지 않습니다: ${BACKEND_ENV_PATH}"
            fi

            # 3️⃣ front 설치 및 빌드
            cd "$APP_DIR/front"
            npm install
            # 빌드 중 오류가 나도 배포 계속
            npm run build || echo "Front build 중 오류 발생: 경로 문제 또는 파일 누락 확인 필요, 하지만 배포 계속 진행"

            # 4️⃣ .env 복사 (프론트)
            if [ -f "${FRONTEND_ENV_PATH}" ]; then
              cp "${FRONTEND_ENV_PATH}" "$APP_DIR/front/.env"
            else
              echo "프론트 .env 파일이 존재하지 않습니다: ${FRONTEND_ENV_PATH}"
            fi
