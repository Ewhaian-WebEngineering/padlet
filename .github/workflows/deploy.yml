name: CI/CD Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      BACKEND_FRONTEND_URL: ${{ secrets.BACKEND_FRONTEND_URL }}
      BACKEND_MONGO_URL: ${{ secrets.BACKEND_MONGO_URL }}
      BACKEND_SESSION_SECRET: ${{ secrets.BACKEND_SESSION_SECRET }}
      BACKEND_KAKAO_REST_API_KEY: ${{ secrets.BACKEND_KAKAO_REST_API_KEY }}
      BACKEND_KAKAO_REDIRECT_URI: ${{ secrets.BACKEND_KAKAO_REDIRECT_URI }}
      FRONTEND_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            APP_DIR="/home/ubuntu/app"

            # --------------------
            # 1️⃣ private repo pull
            # --------------------
            if [ -d "$APP_DIR" ]; then
              cd $APP_DIR
              git reset --hard
              git pull https://$GH_PAT@github.com/Ewhaian-WebEngineering/padlet.git
            else
              git clone https://$GH_PAT@github.com/Ewhaian-WebEngineering/padlet.git $APP_DIR
              cd $APP_DIR
            fi

            # --------------------
            # 2️⃣ 백엔드 배포
            # --------------------
            cd $APP_DIR/backend
            cat <<EOF > .env
PORT=${BACKEND_PORT}
FRONTEND_URL=${BACKEND_FRONTEND_URL}
MONGO_URL=${BACKEND_MONGO_URL}
SESSION_SECRET=${BACKEND_SESSION_SECRET}
KAKAO_REST_API_KEY=${BACKEND_KAKAO_REST_API_KEY}
KAKAO_REDIRECT_URI=${BACKEND_KAKAO_REDIRECT_URI}
EOF

            npm install
            pm2 startOrRestart ecosystem.config.js --env production

            # --------------------
            # 3️⃣ 프론트엔드 배포
            # --------------------
            cd $APP_DIR/frontend
            cat <<EOF > .env
VITE_API_BASE_URL=${FRONTEND_API_BASE_URL}
VITE_PORT=${FRONTEND_PORT}
EOF

            npm install
            npm run build

            # --------------------
            # 4️⃣ Nginx 재시작
            # --------------------
            sudo cp $APP_DIR/nginx.conf /etc/nginx/sites-available/default
            sudo systemctl restart nginx
